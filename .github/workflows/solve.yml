name: solve
on:
  workflow_dispatch:
    inputs:
      cnf: {required: true, type: string}
      tag: {required: true, type: string}
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        id: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 https://github.com/arminbiere/kissat k && cd k && ./configure --quiet >/dev/null && make -j4 >/dev/null 2>&1; ls build/kissat
      - run: python3 run.py "${{ inputs.cnf }}" ${{ matrix.id }} "${{ inputs.tag }}"
